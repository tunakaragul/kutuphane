               : { author: line.slice(0, i).trim(), title: line.slice(i + 3).trim() };
};

  let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

  add(new THREE.BoxGeometry(.04, .03, .3), dark, Math.sin(a)*.15, .1, Math.cos(a)*.15, chair).rotation.y = a;
  add(new THREE.SphereGeometry(.035, 12, 12), mat(0x050505, .8), Math.sin(a)*.3, .04, Math.cos(a)*.3, chair);
}
chair.position.set(0, 0, -0.95);
scene.add(chair);
let chairYaw = 0.12, chairVel = 0;
const chairParts = [];
chair.traverse(o => { if (o.isMesh) { o.userData.chair = true; chairParts.push(o); } });

// ---------- Kitaplık ----------
const SHELF_W = .95, SHELF_H = 2.45, SHELF_D = .28, ROWS = 6;
const BOARD = .025, SIDE = .03;
const SHELF_FRONT_Z = BACK_Z + SHELF_D;
const pitchRow = (SHELF_H - BOARD) / ROWS;
const woodMat = mat(0x17181b, .55, .05);
const shelfParts = [];

function makeBookshelf(x) {
  const g = new THREE.Group();
  add(new THREE.BoxGeometry(SIDE, SHELF_H, SHELF_D), woodMat, -SHELF_W/2 + SIDE/2, SHELF_H/2, 0, g);
  add(new THREE.BoxGeometry(SIDE, SHELF_H, SHELF_D), woodMat,  SHELF_W/2 - SIDE/2, SHELF_H/2, 0, g);
  for (let i = 0; i <= ROWS; i++)
    add(new THREE.BoxGeometry(SHELF_W, BOARD, SHELF_D), woodMat, 0, BOARD/2 + i*pitchRow, 0, g);
  add(new THREE.BoxGeometry(SHELF_W, SHELF_H, .012), woodMat, 0, SHELF_H/2, -SHELF_D/2 + .006, g);
  g.position.set(x, 0, BACK_Z + SHELF_D/2);
  g.traverse(o => { if (o.isMesh) { o.userData.shelf = g; shelfParts.push(o); } });
  scene.add(g); return g;
}
const shelves = [makeBookshelf(-1.45), makeBookshelf(1.45)];

// ---------- Kitap sırtı dokuları ----------
const palette = ['#8c2f39','#2f4b7c','#2d6a4f','#c8963e','#5b3a29','#3d3b6e','#a3a3a3','#1f2933','#b5523b','#4a7c7e','#6b4c9a','#d9c9a3','#c0392b','#16697a'];
const TEX_SCALE = isMobile ? .75 : 1;
const pageMat = mat(0xefe6d2, .95);
const coverCache = new Map();                         // aynı renkli kapaklar tek materyali paylaşır
const coverMat = color => { if (!coverCache.has(color)) coverCache.set(color, mat(color, .7)); return coverCache.get(color); };

function fitText(ctx, text, maxW, startSize, minSize) {
  let size = startSize; ctx.font = `bold ${size}px Georgia`;
  while (ctx.measureText(text).width > maxW && size > minSize) { size -= 2; ctx.font = `bold ${size}px Georgia`; }
}
function spineTexture(title, color) {                 // dikey kitap: yazı aşağı doğru akar
  const c = document.createElement('canvas'); c.width = 128*TEX_SCALE; c.height = 512*TEX_SCALE;
  const x = c.getContext('2d'); x.scale(TEX_SCALE, TEX_SCALE);
  x.fillStyle = color; x.fillRect(0, 0, 128, 512);
  const light = rnd() > .5;
  x.fillStyle = light ? 'rgba(255,255,255,.55)' : 'rgba(0,0,0,.35)';
  x.fillRect(0, 30, 128, 7); x.fillRect(0, 476, 128, 7);
  x.beginPath(); x.arc(64, 447, 12, 0, 7); x.fill();
  x.save(); x.translate(64, 250); x.rotate(Math.PI/2);
  fitText(x, title, 400, 54, 14);
  x.fillStyle = light ? '#fff' : '#f4efe2'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(title, 0, 0); x.restore();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = isMobile ? 4 : 8;
  return t;
}
function spineTextureH(title, color, thick, len) {    // yatık kitap: yazı soldan sağa
  const W = 512, H = Math.max(40, Math.round(W * thick / len));
  const c = document.createElement('canvas'); c.width = W*TEX_SCALE; c.height = H*TEX_SCALE;
  const x = c.getContext('2d'); x.scale(TEX_SCALE, TEX_SCALE);
  x.fillStyle = color; x.fillRect(0, 0, W, H);
  const light = rnd() > .5;
  x.fillStyle = light ? 'rgba(255,255,255,.55)' : 'rgba(0,0,0,.35)';
  x.fillRect(34, 0, 6, H); x.fillRect(W - 40, 0, 6, H);
  fitText(x, title, W - 130, H * .6, 12);
  x.fillStyle = light ? '#fff' : '#f4efe2'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(title, W/2, H/2 + 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = isMobile ? 4 : 8;
  return t;
}

// ---------- Kitapları raflara diz ----------
const bookMeshes = [];
const innerW = SHELF_W - 2*SIDE;
[leftRows, rightRows].forEach((rowsOfShelf, si) => {
  const shelf = shelves[si];
  rowsOfShelf.forEach((block, i) => {
    const list = toRow(block);
    const row = ROWS - 1 - i;                          // ilk şablon en üst raf
    const floorY = BOARD + row*pitchRow + BOARD/2;
    const maxH = pitchRow - BOARD - .05;

    // Genişlikler: raf dolsun ama tek kitap 7 cm'den kalın olmasın
    const weights = list.map(() => .8 + rnd()*.4);
    const total = Math.min(innerW - .02, list.length * .07);
    const sumW = weights.reduce((a, b) => a + b, 0);
    let cursor = -innerW/2 + .01;

    list.forEach((bk, k) => {
      const w = weights[k] / sumW * total;
      const h = Math.min(maxH, .2 + rnd()*(maxH - .2));
      const d = .18 + rnd()*.06;
      const color = palette[Math.floor(rnd()*palette.length)];
      const cover = coverMat(color);
      const spine = new THREE.MeshStandardMaterial({map: spineTexture(bk.title, color), roughness:.65});
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [cover, cover, pageMat, pageMat, spine, pageMat]);
      const baseZ = -SHELF_D/2 + .012 + d/2 + rnd()*.02;
      mesh.position.set(cursor + w/2, floorY + h/2, baseZ);
      mesh.castShadow = true; mesh.receiveShadow = true;
      mesh.userData = {title: fullName(bk), baseZ, targetZ: baseZ, shelf, depth: d};
      shelf.add(mesh);
      bookMeshes.push(mesh);
      cursor += w;
    });
  });
});

// ---------- Yerdeki kitap yığınları ----------
function makeStack(cx, cz, block, label, fallbackCount) {
  let items = toRow(block);
  if (!items.length) items = Array.from({length: fallbackCount}, (_, i) => ({author: '', title: `${label} ${i + 1}`}));
  items = items.slice().reverse();                     // ilk satır en üstteki kitap
  const anchor = new THREE.Object3D();                 // yaklaşma/inceleme kodu için bağlantı noktası
  anchor.position.set(cx, 0, 0);
  let y = .001;
  items.forEach(bk => {
    const thick = .025 + rnd()*.025;
    const len = .2 + rnd()*.07, dep = .14 + rnd()*.05;
    const color = palette[Math.floor(rnd()*palette.length)];
    const cover = coverMat(color);
    const spine = new THREE.MeshStandardMaterial({ map: spineTextureH(bk.title, color, thick, len), roughness:.65 });
    // Yüz sırası: +x, -x, +y, -y, +z (sırt, öne bakar), -z
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(len, thick, dep),
                                [pageMat, pageMat, cover, cover, spine, pageMat]);
    const px = cx + (rnd() - .5)*.025, pz = cz + (rnd() - .5)*.02;
    mesh.position.set(px, y + thick/2, pz);
    mesh.rotation.y = (rnd() - .5) * .12;
    mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.userData = { title: fullName(bk), baseZ: pz, targetZ: pz, shelf: anchor, depth: dep, lying: true };
    scene.add(mesh);
    bookMeshes.push(mesh);
    y += thick + .0005;
  });
}
makeStack(-2.14, BACK_Z + .13, leftStackBooks,  'Sol yığın', 24);
makeStack( 2.14, BACK_Z + .13, rightStackBooks, 'Sağ yığın', 12);

const pickables = [...bookMeshes, ...shelfParts, ...chairParts];

// ======================================================================
//  KAMERA MODLARI: orbit • pov (rafa yakın) • seat (koltuk) • focus (kitap)
// ======================================================================
let mode = 'orbit';
let seatPitch = 0, seatFov = 60;
const homeView = { pos:new V3(0,1.35,2.3), yaw:0, pitch:Math.atan2(-.15, 4.3), fov:55 };
let povView = null, focusView = null;
let focusedBook = null, prevMode = 'pov';
let transition = null;
let lastPointerType = 'mouse';

const lerpAngle = (a, b, t) => a + (((b - a + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI) * t;
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

// Dikey ekranda yatay görüş daralır; dikey açıyı büyüterek dengeliyoruz
const boost = () => camera.aspect < 1 ? 1 + (1 - camera.aspect) * .9 : 1;
function setFov(base) {
  const f = Math.min(100, base * boost());
  if (Math.abs(camera.fov - f) > .01) { camera.fov = f; camera.updateProjectionMatrix(); }
}

function seatTarget() {
  const dir = new V3(-Math.sin(chairYaw), 0, -Math.cos(chairYaw));
  return { pos: new V3(chair.position.x, 1.17, chair.position.z).addScaledVector(dir, .05),
           yaw: chairYaw, pitch: seatPitch, fov: seatFov };
}
function applyView(v) {
  camera.position.copy(v.pos);
  camera.rotation.set(v.pitch, v.yaw, 0);
  setFov(v.fov);
}
function goTo(newMode, getTarget, dur = 1.1, done) {
  controls.enabled = false;
  if (lastPointerType === 'touch') mouse.set(9, 9);
  transition = {
    from: { pos: camera.position.clone(), yaw: camera.rotation.y, pitch: camera.rotation.x, fov: camera.fov / boost() },
    to: getTarget, t: 0, dur, done
  };
  mode = newMode; updateUI();
}
function stepTransition(dt) {
  const tr = transition; tr.t = Math.min(1, tr.t + dt / tr.dur);
  const e = ease(tr.t), a = tr.from, b = tr.to();
  applyView({ pos: a.pos.clone().lerp(b.pos, e), yaw: lerpAngle(a.yaw, b.yaw, e),
              pitch: a.pitch + (b.pitch - a.pitch)*e, fov: a.fov + (b.fov - a.fov)*e });
  if (tr.t >= 1) { const d = tr.done; transition = null; d && d(); }
}

function goOrbit() {
  closePanel();
  goTo('orbit', () => homeView, 1.2, () => { controls.target.set(0, 1.2, -2); controls.enabled = true; controls.update(); });
}
function approachShelf(shelf, point, done) {
  closePanel();
  const x = clamp(point.x, shelf.position.x - .3, shelf.position.x + .3);
  const y = clamp(point.y, 1.0, 1.75);
  const pos = new V3(x, y, SHELF_FRONT_Z + .85);
  const dir = new V3(point.x, point.y, SHELF_FRONT_Z).sub(pos);
  const yaw = Math.atan2(-dir.x, -dir.z), pitch = Math.atan2(dir.y, Math.hypot(dir.x, dir.z));
  povView = { pos, yaw, pitch, fov: 50, baseYaw: yaw };
  goTo('pov', () => povView, 1.0, done);
}
function sitDown() { closePanel(); seatPitch = 0; goTo('seat', seatTarget, 1.2); }

function focusBook(b) {
  if (mode !== 'focus') prevMode = mode;
  focusedBook = b;
  const wp = new V3(); b.getWorldPosition(wp);
  const frontZ = b.userData.shelf.position.z + b.userData.baseZ + b.userData.depth/2 + .1;
  focusView = { pos: new V3(wp.x, wp.y, frontZ + .45), yaw: 0, pitch: 0, fov: 45 };
  if (b.userData.lying) {
    focusView.pos.y += .3;
    focusView.pitch = -Math.atan2(.3, .45);
  }
  selected = b.userData.title; panel.style.display = 'block'; renderPanel();
  goTo('focus', () => focusView, .8);
}

function closeFocus() {
  panel.style.display = 'none'; focusedBook = null; selected = null;
  if (prevMode === 'seat') goTo('seat', seatTarget, .9);
  else goTo('pov', () => povView, .9);
}
function closePanel() { panel.style.display = 'none'; focusedBook = null; selected = null; }
function goBack() { if (mode === 'focus') closeFocus(); else if (mode !== 'orbit') goOrbit(); }
function rowStep(dir) {
  if (mode !== 'pov' || !povView) return;
  povView.pos.y = clamp(povView.pos.y + dir*.38, .6, 2.0);
  goTo('pov', () => povView, .4);
}

// ---------- Arama ----------
const norm = s => s.toLocaleLowerCase('tr').replace(/ı/g, 'i').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
let lastQuery = '', matchIdx = 0;
function searchBook(raw) {
  const q = norm(raw.trim());
  if (!q) return;
  const found = bookMeshes.filter(b => norm(b.userData.title).includes(q));
  if (!found.length) { hint.textContent = `Bulunamadı: ${raw.trim()}`; return; }
  matchIdx = q === lastQuery ? (matchIdx + 1) % found.length : 0;   // aynı aramada Enter: sonraki sonuç
  lastQuery = q;
  const b = found[matchIdx];
  const wp = new V3(); b.getWorldPosition(wp);
  approachShelf(b.userData.shelf, wp, () => focusBook(b));
  hint.textContent = `Sonuç ${matchIdx + 1}/${found.length} • tekrar Enter: sonraki`;
}
const searchEl = document.getElementById('search');
searchEl.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter') { searchBook(searchEl.value); searchEl.blur(); }
  if (e.key === 'Escape') searchEl.blur();
});

const hint = document.getElementById('hint');
const hints = isMobile ? {
  orbit: 'Parmakla sürükle: bak • İki parmak: yaklaş • Rafa dokun: yaklaş • Sandalyeye dokun: otur',
  pov:   'Sürükle: bak • Çimdik: zoom • ▲▼: raf sırası • Kitaba 1 kez dokun: ad/puan, 2 kez: incele',
  seat:  'Sürükle: koltuğu döndür • Çimdik: zoom • Kitaba 1 kez dokun: ad/puan, 2 kez: incele',
  focus: 'Yıldıza dokun: puan ver • Geri: önceki konum'
} : {
  orbit: 'Sürükle: bak • Tekerlek: yaklaş • Rafa tıkla: yaklaş • Sandalyeye tıkla: otur • M: mod değiştir',
  pov:   'Sürükle: etrafa bak • Tekerlek: zoom • ↑/↓: yükseklik • Kitaba tıkla: incele • Esc: çık',
  seat:  'Sürükle veya A/D ←/→: koltuğu döndür • Tekerlek: zoom • Kitaba tıkla: incele • Esc: kalk',
  focus: 'Yıldıza tıkla: puan ver • Esc: geri'
};
function updateUI() {
  hint.textContent = hints[mode];
  hint.style.visibility = mode === 'focus' ? 'hidden' : 'visible';     // panelle çakışmasın
  document.querySelectorAll('#ui button').forEach(b => b.classList.remove('active'));
  const act = mode === 'orbit' ? 'orbit' : mode === 'seat' ? 'seat' : null;
  if (act) document.querySelector(`#ui button[data-act="${act}"]`).classList.add('active');
  document.getElementById('seatBtn').textContent = mode === 'seat' ? '🧍 Kalk' : '🪑 Otur';
  document.getElementById('backBtn').style.display = mode === 'orbit' ? 'none' : 'inline-block';
  document.getElementById('rowBtns').style.display = mode === 'pov' ? 'flex' : 'none';
}
document.querySelectorAll('#ui button').forEach(b => b.addEventListener('click', () => {
  const a = b.dataset.act;
  if (a === 'back')  goBack();
  if (a === 'orbit') goOrbit();
  if (a === 'left')  approachShelf(shelves[0], new V3(shelves[0].position.x, 1.5, SHELF_FRONT_Z));
  if (a === 'right') approachShelf(shelves[1], new V3(shelves[1].position.x, 1.5, SHELF_FRONT_Z));
  if (a === 'seat')  mode === 'seat' ? goOrbit() : sitDown();
  b.blur();
}));
document.getElementById('rowUp').onclick = () => rowStep(1);
document.getElementById('rowDown').onclick = () => rowStep(-1);

// ---------- Puan paneli + tooltip ----------
const tip = document.getElementById('tip');
const panel = document.getElementById('panel');
const pstars = document.getElementById('pstars');
const ptitle = document.getElementById('ptitle');
let hovered = null, selected = null;
const starsText = r => r ? '★'.repeat(r) + '☆'.repeat(5 - r) : 'Henüz puan yok';

function placeTip(x, y, touch) {
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
  tip.style.transform = touch ? 'translate(-50%,-130%)' : 'translate(14px,14px)';
}
function updateTip() {
  if (!hovered) { tip.style.display = 'none'; return; }
  const t = hovered.userData.title;
  tip.textContent = '';                                  // innerHTML yerine güvenli metin ekleme
  const b = document.createElement('b'); b.textContent = t;
  const s = document.createElement('span'); s.className = 'stars'; s.textContent = starsText(ratings[t]);
  tip.append(b, document.createElement('br'), s);
  tip.style.display = 'block';
}
function renderPanel() {
  const r = ratings[selected] || 0;
  ptitle.textContent = selected;
  pstars.innerHTML = '';
  for (let i = 1; i <= 5; i++) {
    const s = document.createElement('span');
    s.className = 'st' + (i <= r ? ' on' : ''); s.textContent = '★';
    s.onclick = () => {
      ratings[selected] = (ratings[selected] === i) ? 0 : i;     // aynı yıldıza tekrar basınca puan silinir
      if (!ratings[selected]) delete ratings[selected];
      saveRatings(); renderPanel(); updateTip();
    };
    pstars.appendChild(s);
  }
}
document.getElementById('pclose').onclick = goBack;
updateUI();

// ---------- Fare / dokunma / klavye ----------
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2(9, 9);
let dragging = false, last = {x:0, y:0, t:0}, downPos = null;
const pts = new Map();
let pinchD = 0;
const keys = new Set();

addEventListener('pointermove', e => {
  if (e.pointerType !== 'touch') {
    if (e.target === renderer.domElement) {
      mouse.x = (e.clientX/innerWidth)*2 - 1;
      mouse.y = -(e.clientY/innerHeight)*2 + 1;
      placeTip(e.clientX, e.clientY, false);
    } else mouse.set(9, 9);
  }
  if (pts.has(e.pointerId)) pts.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if (pts.size >= 2) {
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchD) {
      const delta = pinchD - d;
      if (mode === 'pov' && povView) povView.fov = clamp(povView.fov + delta*.15, 28, 65);
      if (mode === 'seat') seatFov = clamp(seatFov + delta*.15, 28, 70);
    }
    pinchD = d; return;
  }
  if (!dragging) return;
  const dx = e.clientX - last.x, dy = e.clientY - last.y;
  const dtEvt = Math.max(.001, (e.timeStamp - last.t) / 1000);
  last = {x:e.clientX, y:e.clientY, t:e.timeStamp};
  if (mode === 'pov' && povView) {
    const k = .003 * (povView.fov / 55);
    povView.yaw = clamp(povView.yaw + dx*k, povView.baseYaw - 1.3, povView.baseYaw + 1.3);
    povView.pitch = clamp(povView.pitch + dy*k, -1.2, 1.2);
  } else if (mode === 'seat') {
    const dyaw = dx * .004 * (seatFov / 60);
    chairYaw += dyaw;
    chairVel = chairVel*.5 + clamp(dyaw / dtEvt, -6, 6)*.5;
    seatPitch = clamp(seatPitch + dy*.003*(seatFov/60), -1.0, 1.0);
  }
});
renderer.domElement.addEventListener('pointerdown', e => {
  lastPointerType = e.pointerType;
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  pinchD = 0;
  if (pts.size === 1) {
    dragging = true; downPos = {x:e.clientX, y:e.clientY};
    last = {x:e.clientX, y:e.clientY, t:e.timeStamp};
  } else { dragging = false; downPos = {x:-999, y:-999}; }
});
function endPointer(e) {
  pts.delete(e.pointerId); pinchD = 0;
  if (pts.size === 0) {
    dragging = false;
    if (e.timeStamp - last.t > 80) chairVel = 0;
  } else if (pts.size === 1) {
    const p = [...pts.values()][0];
    dragging = true; last = {x:p.x, y:p.y, t:e.timeStamp};
  }
}
addEventListener('pointerup', endPointer);
addEventListener('pointercancel', endPointer);
renderer.domElement.addEventListener('wheel', e => {
  if (mode === 'pov' && povView) povView.fov = clamp(povView.fov + Math.sign(e.deltaY)*3, 28, 65);
  if (mode === 'seat') seatFov = clamp(seatFov + Math.sign(e.deltaY)*3, 28, 70);
}, {passive:true});

renderer.domElement.addEventListener('click', e => {
  if (downPos && Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 8) return;
  if (transition) return;
  const touch = lastPointerType === 'touch';
  const ndc = new THREE.Vector2((e.clientX/innerWidth)*2 - 1, -(e.clientY/innerHeight)*2 + 1);
  ray.setFromCamera(ndc, camera);
  const list = mode === 'seat' ? pickables.filter(o => !o.userData.chair) : pickables;
  const hit = ray.intersectObjects(list, false)[0];

  if (touch) {
    // Dokunmatik: 1. dokunuş = önizleme (ad+puan), 2. dokunuş = incele
    if (hit && hit.object.userData.title && (mode === 'pov' || mode === 'seat') && hovered !== hit.object) {
      mouse.copy(ndc); placeTip(e.clientX, e.clientY, true); return;
    }
    mouse.set(9, 9);
  }
  if (!hit) return;
  const u = hit.object.userData;
  if (u.title) {
    if (mode === 'orbit') approachShelf(u.shelf, hit.point);
    else focusBook(hit.object);
  } else if (u.shelf && mode !== 'focus') {
    approachShelf(u.shelf, hit.point);
  } else if (u.chair && mode !== 'seat' && mode !== 'focus') {
    sitDown();
  }
});

addEventListener('keydown', e => {
  if (e.target instanceof HTMLInputElement) return;      // arama kutusuna yazarken kısayollar çalışmasın
  keys.add(e.code);
  if (e.code === 'Escape') goBack();
  if (e.code === 'KeyM') {
    if (mode === 'orbit') povView ? goTo('pov', () => povView, 1.0) : approachShelf(shelves[0], new V3(shelves[0].position.x, 1.5, SHELF_FRONT_Z));
    else if (mode === 'pov') sitDown();
    else if (mode === 'seat') goOrbit();
  }
  if (e.code === 'ArrowUp' || e.code === 'ArrowDown') {
    if (mode === 'pov') { e.preventDefault(); rowStep(e.code === 'ArrowUp' ? 1 : -1); }
  }
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());            // sekme değişince tuş takılı kalmasın

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- Ana döngü ----------
const ray2 = new THREE.Raycaster();
let lastT = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastT)/1000, .05); lastT = now;

  if (mode === 'seat') {
    if (keys.has('KeyA') || keys.has('ArrowLeft'))  chairVel += 5*dt;
    if (keys.has('KeyD') || keys.has('ArrowRight')) chairVel -= 5*dt;
    chairVel = clamp(chairVel, -3, 3);
  }
  if (!(dragging && mode === 'seat')) { chairYaw += chairVel*dt; chairVel *= Math.pow(.15, dt); }
  chair.rotation.y = chairYaw;

  if (transition) stepTransition(dt);
  else if (mode === 'orbit') {
    setFov(homeView.fov);
    controls.update();
    camera.position.set(clamp(camera.position.x, -2.4, 2.4), clamp(camera.position.y, .3, 2.6), clamp(camera.position.z, -1.9, 2.3));
  }
  else if (mode === 'seat') applyView(seatTarget());
  else if (mode === 'pov' && povView) applyView(povView);
  else if (mode === 'focus' && focusView) applyView(focusView);

  // İmleç ekran dışındaysa (9,9) ışın hesabını atla
  let next = null;
  if (Math.abs(mouse.x) <= 1 && Math.abs(mouse.y) <= 1) {
    ray2.setFromCamera(mouse, camera);
    const hit = ray2.intersectObjects(bookMeshes, false)[0];
    next = hit ? hit.object : null;
  }
  if (next !== hovered) {
    hovered = next;
    renderer.domElement.style.cursor = hovered ? 'pointer' : 'grab';
    updateTip();
  }
  bookMeshes.forEach(m => {
    const out = (m === hovered || m === focusedBook) ? .09 : 0;
    m.userData.targetZ = m.userData.baseZ + out;
    m.position.z += (m.userData.targetZ - m.position.z) * .18;
  });
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
