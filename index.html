
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanal Kütüphane</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
  canvas{display:block}
  #tip{position:fixed;pointer-events:none;background:rgba(15,15,15,.88);color:#fff;
       padding:8px 12px;border-radius:8px;font-size:14px;display:none;transform:translate(14px,14px);
       box-shadow:0 4px 14px rgba(0,0,0,.4)}
  #tip .stars{color:#ffc933;letter-spacing:2px}
  #hint{position:fixed;left:12px;bottom:12px;color:#ccc;font-size:12px;text-shadow:0 1px 3px #000}
  #ui{position:fixed;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}
  #ui button{background:rgba(15,15,15,.75);color:#ddd;border:1px solid #555;border-radius:8px;
             padding:8px 12px;cursor:pointer;font-size:13px}
  #ui button:hover{background:rgba(60,60,60,.85)}
  #ui button.active{background:#2649B2;border-color:#4A74F3;color:#fff}
  #panel{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:rgba(15,15,15,.92);
         color:#fff;padding:14px 22px;border-radius:12px;display:none;text-align:center;min-width:240px}
  #panel .st{font-size:34px;cursor:pointer;color:#555;user-select:none}
  #panel .st.on{color:#ffc933}
  #panel button{margin-top:8px;background:none;border:1px solid #666;color:#ccc;border-radius:6px;cursor:pointer;padding:4px 12px}
</style>
</head>
<body>
<div id="tip"></div>
<div id="ui">
  <button data-act="orbit">🌐 Serbest bakış</button>
  <button data-act="left">📚 Sol raf</button>
  <button data-act="right">📚 Sağ raf</button>
  <button data-act="seat" id="seatBtn">🪑 Otur</button>
</div>
<div id="hint"></div>
<div id="panel">
  <div id="ptitle" style="font-weight:bold;margin-bottom:6px"></div>
  <div id="pstars"></div>
  <button id="pclose">Geri (Esc)</button>
</div>

<script type="importmap">
{"imports":{
 "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
 "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const V3 = THREE.Vector3, clamp = THREE.MathUtils.clamp;

// ---------- Kitap isimleri (kendi listeni yaz; yetmezse "Kitap N" ile devam eder) ----------
const titles = [
  'Suç ve Ceza','Sefiller','Tutunamayanlar','Kürk Mantolu Madonna','1984','Simyacı',
  'Beyaz Diş','Yabancı','Dönüşüm','Saatleri Ayarlama Enstitüsü','Huzur','Körlük',
  'Sapiens','Dune','Vadideki Zambak','Küçük Prens','Hayvan Çiftliği','Ateşten Gömlek',
  'İnsan Ne ile Yaşar','Mai ve Siyah','Sessiz Ev','Bilge Kral','Anna Karenina','Savaş ve Barış',
  'Karamazov Kardeşler','Olasılıksız','Beyaz Kale','Kar','Masumiyet Müzesi','Çalıkuşu',
  'Yaprak Dökümü','Aylak Adam','İnce Memed','Sefiller 2','Fahrenheit 451','Cesur Yeni Dünya',
  'Vakıf','Neuromancer','Şeker Portakalı','Martin Eden'
];

// ---------- Puan saklama ----------
const ratings = JSON.parse(localStorage.getItem('ratings') || '{}');
const saveRatings = () => localStorage.setItem('ratings', JSON.stringify(ratings));

// ---------- Sahne ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171c);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.05, 50);
camera.rotation.order = 'YXZ';              // yaw (sağ-sol) ve pitch (yukarı-aşağı) için
camera.position.set(0, 1.35, 2.3);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, -2);
controls.minDistance = 0.8; controls.maxDistance = 4.2;
controls.maxPolarAngle = Math.PI * 0.55;
controls.enableDamping = true;
controls.update();

// ---------- Işık ----------
scene.add(new THREE.HemisphereLight(0xdfe9ff, 0x4a3a2a, 0.9));
const sun = new THREE.DirectionalLight(0xfff1dd, 1.6);
sun.position.set(1.5, 3, 2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-3, right:3, top:3, bottom:-3, near:.5, far:10});
sun.shadow.bias = -0.0004;
scene.add(sun);
const windowLight = new THREE.PointLight(0xbcd8ff, 2.2, 6);
windowLight.position.set(0, 1.9, -1.5);
scene.add(windowLight);

// ---------- Yardımcılar ----------
const mat = (c, r=.8, m=0) => new THREE.MeshStandardMaterial({color:c, roughness:r, metalness:m});
const add = (geo, material, x, y, z, parent=scene, shadow=true) => {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true;
  parent.add(m); return m;
};

// ---------- Oda ----------
const ROOM_W = 5, ROOM_D = 4.4, ROOM_H = 2.8, BACK_Z = -2;
const wallMat = mat(0xe9e6e0, .95);
add(new THREE.PlaneGeometry(ROOM_W, ROOM_D), mat(0x7a5a3c, .6), 0, 0, BACK_Z + ROOM_D/2, scene).rotation.x = -Math.PI/2;
add(new THREE.PlaneGeometry(ROOM_W, ROOM_D), mat(0xf4f2ee, 1), 0, ROOM_H, BACK_Z + ROOM_D/2, scene, false).rotation.x = Math.PI/2;
add(new THREE.PlaneGeometry(ROOM_W, ROOM_H), wallMat, 0, ROOM_H/2, BACK_Z, scene, false);
add(new THREE.PlaneGeometry(ROOM_D, ROOM_H), wallMat, -ROOM_W/2, ROOM_H/2, BACK_Z + ROOM_D/2, scene, false).rotation.y = Math.PI/2;
add(new THREE.PlaneGeometry(ROOM_D, ROOM_H), wallMat, ROOM_W/2, ROOM_H/2, BACK_Z + ROOM_D/2, scene, false).rotation.y = -Math.PI/2;
add(new THREE.CylinderGeometry(1.1, 1.1, .01, 48), mat(0x3b4452, 1), 0, .006, -1, scene, false);

// ---------- Pencere ----------
const skyCanvas = document.createElement('canvas'); skyCanvas.width = 8; skyCanvas.height = 256;
{ const c = skyCanvas.getContext('2d'); const g = c.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#8fc1f2'); g.addColorStop(.7,'#dcecfa'); g.addColorStop(1,'#c9bfb2');
  c.fillStyle = g; c.fillRect(0,0,8,256); }
const skyTex = new THREE.CanvasTexture(skyCanvas); skyTex.colorSpace = THREE.SRGBColorSpace;
const WIN_W = 1.5, WIN_H = 1.4, WIN_Y = 1.65;
add(new THREE.PlaneGeometry(WIN_W, WIN_H), new THREE.MeshBasicMaterial({map:skyTex}), 0, WIN_Y, BACK_Z + .01, scene, false);
const frameMat = mat(0x24262a, .5, .2), T = .05;
add(new THREE.BoxGeometry(WIN_W+2*T, T, .08), frameMat, 0,  WIN_Y+WIN_H/2+T/2, BACK_Z+.03);
add(new THREE.BoxGeometry(WIN_W+2*T, T, .08), frameMat, 0,  WIN_Y-WIN_H/2-T/2, BACK_Z+.03);
add(new THREE.BoxGeometry(T, WIN_H, .08), frameMat, -WIN_W/2-T/2, WIN_Y, BACK_Z+.03);
add(new THREE.BoxGeometry(T, WIN_H, .08), frameMat,  WIN_W/2+T/2, WIN_Y, BACK_Z+.03);
add(new THREE.BoxGeometry(T*.8, WIN_H, .06), frameMat, 0, WIN_Y, BACK_Z+.03);
add(new THREE.BoxGeometry(WIN_W, T*.8, .06), frameMat, 0, WIN_Y+.45, BACK_Z+.03);
add(new THREE.BoxGeometry(WIN_W*.47, .42, .02), mat(0x2d2f33, .6), -WIN_W*.25, WIN_Y+WIN_H/2-.22, BACK_Z+.05, scene, false);
add(new THREE.BoxGeometry(WIN_W*.47, .42, .02), mat(0x2d2f33, .6),  WIN_W*.25, WIN_Y+WIN_H/2-.22, BACK_Z+.05, scene, false);

// ---------- Masa + monitör ----------
const deskMat = mat(0x16171a, .5, .1);
add(new THREE.BoxGeometry(1.4, .04, .6), mat(0xcdb48f, .7), 0, .76, BACK_Z+.35);
add(new THREE.BoxGeometry(.04, .74, .55), deskMat, -.68, .37, BACK_Z+.35);
add(new THREE.BoxGeometry(.04, .74, .55), deskMat,  .68, .37, BACK_Z+.35);
add(new THREE.BoxGeometry(1.36, .4, .02), deskMat, 0, .5, BACK_Z+.1);
add(new THREE.BoxGeometry(.7, .4, .03), mat(0x050505, .3, .3), 0, 1.0, BACK_Z+.3);
add(new THREE.BoxGeometry(.05, .2, .05), deskMat, 0, .88, BACK_Z+.3);

// ---------- Koltuk (yerel +z = sırtlık, oturan kişi -z'ye bakar) ----------
const chair = new THREE.Group();
const leather = mat(0x9a4d2c, .45), dark = mat(0x1b1b1d, .5, .3);
add(new RoundedBoxGeometry(.56, .12, .54, 4, .04), leather, 0, .52, 0, chair);
add(new RoundedBoxGeometry(.54, .62, .12, 4, .05), leather, 0, .92, .27, chair).rotation.x = -.1;
add(new RoundedBoxGeometry(.34, .2, .1, 4, .05),  leather, 0, 1.36, .31, chair).rotation.x = -.1;
add(new THREE.CylinderGeometry(.03, .03, .1), dark, 0, 1.22, .3, chair);
[-1, 1].forEach(s => {
  add(new THREE.BoxGeometry(.04, .24, .04), dark, s*.3, .66, .08, chair);
  add(new RoundedBoxGeometry(.07, .05, .34, 3, .02), leather, s*.3, .79, .0, chair);
});
add(new THREE.CylinderGeometry(.035, .035, .34, 16), mat(0x888888, .3, .9), 0, .3, 0, chair);
add(new THREE.CylinderGeometry(.06, .08, .06, 16), dark, 0, .1, 0, chair);
for (let i = 0; i < 5; i++) {
  const a = i / 5 * Math.PI * 2;
  add(new THREE.BoxGeometry(.04, .03, .3), dark, Math.sin(a)*.15, .1, Math.cos(a)*.15, chair).rotation.y = a;
  add(new THREE.SphereGeometry(.035, 12, 12), mat(0x050505, .8), Math.sin(a)*.3, .04, Math.cos(a)*.3, chair);
}
chair.position.set(0, 0, -0.95);
scene.add(chair);
let chairYaw = 0.12, chairVel = 0;           // koltuğun dönüş açısı ve hızı (rad, rad/s)
const chairParts = [];
chair.traverse(o => { if (o.isMesh) { o.userData.chair = true; chairParts.push(o); } });

// ---------- Kitaplık ----------
const SHELF_W = .95, SHELF_H = 2.45, SHELF_D = .28, ROWS = 6;
const BOARD = .025, SIDE = .03;
const SHELF_FRONT_Z = BACK_Z + SHELF_D;
const pitchRow = (SHELF_H - BOARD) / ROWS;
const woodMat = mat(0x17181b, .55, .05);
const shelfParts = [];

function makeBookshelf(x) {
  const g = new THREE.Group();
  add(new THREE.BoxGeometry(SIDE, SHELF_H, SHELF_D), woodMat, -SHELF_W/2 + SIDE/2, SHELF_H/2, 0, g);
  add(new THREE.BoxGeometry(SIDE, SHELF_H, SHELF_D), woodMat,  SHELF_W/2 - SIDE/2, SHELF_H/2, 0, g);
  for (let i = 0; i <= ROWS; i++)
    add(new THREE.BoxGeometry(SHELF_W, BOARD, SHELF_D), woodMat, 0, BOARD/2 + i*pitchRow, 0, g);
  add(new THREE.BoxGeometry(SHELF_W, SHELF_H, .012), woodMat, 0, SHELF_H/2, -SHELF_D/2 + .006, g);
  g.position.set(x, 0, BACK_Z + SHELF_D/2);
  g.traverse(o => { if (o.isMesh) { o.userData.shelf = g; shelfParts.push(o); } });
  scene.add(g); return g;
}
const shelves = [makeBookshelf(-1.45), makeBookshelf(1.45)];

// ---------- Kitap sırtı dokusu ----------
const palette = ['#8c2f39','#2f4b7c','#2d6a4f','#c8963e','#5b3a29','#3d3b6e','#a3a3a3','#1f2933','#b5523b','#4a7c7e','#6b4c9a','#d9c9a3','#c0392b','#16697a'];
function spineTexture(title, color) {
  const c = document.createElement('canvas'); c.width = 128; c.height = 512;
  const x = c.getContext('2d');
  x.fillStyle = color; x.fillRect(0, 0, 128, 512);
  const light = Math.random() > .5;
  x.fillStyle = light ? 'rgba(255,255,255,.55)' : 'rgba(0,0,0,.35)';
  x.fillRect(0, 30, 128, 7); x.fillRect(0, 476, 128, 7);
  x.beginPath(); x.arc(64, 447, 12, 0, 7); x.fill();
  x.save(); x.translate(64, 250); x.rotate(Math.PI/2);
  let size = 54; x.font = `bold ${size}px Georgia`;
  while (x.measureText(title).width > 340 && size > 18) { size -= 2; x.font = `bold ${size}px Georgia`; }
  x.fillStyle = light ? '#fff' : '#f4efe2'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(title, 0, 0); x.restore();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const pageMat = mat(0xefe6d2, .95);

// ---------- Kitapları diz (üst raftan başla, tam doldur) ----------
const bookMeshes = [];
const innerW = SHELF_W - 2*SIDE;
let count = 0;
for (let row = ROWS - 1; row >= 0; row--) {
  for (const shelf of shelves) {
    const floorY = BOARD + row*pitchRow + BOARD/2;
    const maxH = pitchRow - BOARD - .05;
    let cursor = -innerW/2 + .01;
    while (true) {
      const w = .032 + Math.random()*.04;
      if (cursor + w > innerW/2 - .005) break;
      const h = Math.min(maxH, .2 + Math.random()*(maxH - .2));
      const d = .18 + Math.random()*.06;
      const title = titles[count] ?? `Kitap ${count + 1}`;
      const color = palette[Math.floor(Math.random()*palette.length)];
      const cover = mat(color, .7);
      const spine = new THREE.MeshStandardMaterial({map: spineTexture(title, color), roughness:.65});
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [cover, cover, pageMat, pageMat, spine, pageMat]);
      const baseZ = -SHELF_D/2 + .012 + d/2 + Math.random()*.02;
      mesh.position.set(cursor + w/2, floorY + h/2, baseZ);
      mesh.castShadow = true; mesh.receiveShadow = true;
      mesh.userData = {title, baseZ, targetZ: baseZ, shelf, depth: d};
      shelf.add(mesh);
      bookMeshes.push(mesh);
      cursor += w + .001;
      count++;
    }
  }
}
const pickables = [...bookMeshes, ...shelfParts, ...chairParts];

// ======================================================================
//  KAMERA MODLARI: orbit (serbest) • pov (rafa yakın) • seat (koltuk) • focus (kitap)
// ======================================================================
let mode = 'orbit';
let seatPitch = 0, seatFov = 60;
const homeView = { pos:new V3(0,1.35,2.3), yaw:0, pitch:Math.atan2(-.15, 4.3), fov:55 };
let povView = null;            // rafa yakın bakış durumu (sürükleyince değişir)
let focusView = null;          // kitap inceleme bakışı
let focusedBook = null, prevMode = 'pov';
let transition = null;

const lerpAngle = (a, b, t) => a + (((b - a + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI) * t;
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

function seatTarget() {                   // koltuktaki göz konumu (koltukla birlikte döner)
  const dir = new V3(-Math.sin(chairYaw), 0, -Math.cos(chairYaw));
  return { pos: new V3(chair.position.x, 1.17, chair.position.z).addScaledVector(dir, .05),
           yaw: chairYaw, pitch: seatPitch, fov: seatFov };
}
function applyView(v) {
  camera.position.copy(v.pos);
  camera.rotation.set(v.pitch, v.yaw, 0);
  if (Math.abs(camera.fov - v.fov) > .01) { camera.fov = v.fov; camera.updateProjectionMatrix(); }
}
function goTo(newMode, getTarget, dur = 1.1, done) {
  controls.enabled = false;
  transition = {
    from: { pos: camera.position.clone(), yaw: camera.rotation.y, pitch: camera.rotation.x, fov: camera.fov },
    to: getTarget, t: 0, dur, done
  };
  mode = newMode; updateUI();
}
function stepTransition(dt) {
  const tr = transition; tr.t = Math.min(1, tr.t + dt / tr.dur);
  const e = ease(tr.t), a = tr.from, b = tr.to();
  applyView({ pos: a.pos.clone().lerp(b.pos, e), yaw: lerpAngle(a.yaw, b.yaw, e),
              pitch: a.pitch + (b.pitch - a.pitch)*e, fov: a.fov + (b.fov - a.fov)*e });
  if (tr.t >= 1) { const d = tr.done; transition = null; d && d(); }
}

function goOrbit() {
  closePanel();
  goTo('orbit', () => homeView, 1.2, () => { controls.target.set(0, 1.2, -2); controls.enabled = true; controls.update(); });
}
function approachShelf(shelf, point) {     // rafın önünde, noktaya bakan bir istasyon kur
  closePanel();
  const x = clamp(point.x, shelf.position.x - .3, shelf.position.x + .3);
  const y = clamp(point.y, 1.0, 1.75);
  const pos = new V3(x, y, SHELF_FRONT_Z + .85);
  const dir = new V3(point.x, point.y, SHELF_FRONT_Z).sub(pos);
  const yaw = Math.atan2(-dir.x, -dir.z), pitch = Math.atan2(dir.y, Math.hypot(dir.x, dir.z));
  povView = { pos, yaw, pitch, fov: 50, baseYaw: yaw };
  goTo('pov', () => povView, 1.0);
}
function sitDown() {
  closePanel(); seatPitch = 0;
  goTo('seat', seatTarget, 1.2);
}
function focusBook(b) {
  if (mode !== 'focus') prevMode = mode;
  focusedBook = b;
  const wp = new V3(); b.getWorldPosition(wp);
  const frontZ = b.userData.shelf.position.z + b.userData.baseZ + b.userData.depth/2 + .1;
  focusView = { pos: new V3(wp.x, wp.y, frontZ + .45), yaw: 0, pitch: 0, fov: 45 };
  selected = b.userData.title; panel.style.display = 'block'; renderPanel();
  goTo('focus', () => focusView, .8);
}
function closeFocus() {
  panel.style.display = 'none'; focusedBook = null; selected = null;
  if (prevMode === 'seat') goTo('seat', seatTarget, .9);
  else goTo('pov', () => povView, .9);
}
function closePanel() { panel.style.display = 'none'; focusedBook = null; selected = null; }

// ---------- Arayüz ----------
const hint = document.getElementById('hint');
const hints = {
  orbit: 'Sürükle: bak • Tekerlek: yaklaş • Rafa tıkla: yaklaş • Sandalyeye tıkla: otur • Tab: mod değiştir',
  pov:   'Sürükle: etrafa bak • Tekerlek: zoom • ↑/↓: yükseklik • Kitaba tıkla: incele • Esc: çık',
  seat:  'Sürükle veya A/D ←/→: koltuğu döndür • Tekerlek: zoom • Kitaba tıkla: incele • Esc: kalk',
  focus: 'Yıldıza tıkla: puan ver • Esc: geri'
};
function updateUI() {
  hint.textContent = hints[mode];
  document.querySelectorAll('#ui button').forEach(b => b.classList.remove('active'));
  const act = mode === 'orbit' ? 'orbit' : mode === 'seat' ? 'seat' : null;
  if (act) document.querySelector(`#ui button[data-act="${act}"]`).classList.add('active');
  document.getElementById('seatBtn').textContent = mode === 'seat' ? '🧍 Kalk' : '🪑 Otur';
}
document.querySelectorAll('#ui button').forEach(b => b.addEventListener('click', () => {
  const a = b.dataset.act;
  if (a === 'orbit') goOrbit();
  if (a === 'left')  approachShelf(shelves[0], new V3(shelves[0].position.x, 1.5, SHELF_FRONT_Z));
  if (a === 'right') approachShelf(shelves[1], new V3(shelves[1].position.x, 1.5, SHELF_FRONT_Z));
  if (a === 'seat')  mode === 'seat' ? goOrbit() : sitDown();
  b.blur();
}));
updateUI();

// ---------- Puan paneli + tooltip ----------
const tip = document.getElementById('tip');
const panel = document.getElementById('panel');
const pstars = document.getElementById('pstars');
const ptitle = document.getElementById('ptitle');
let hovered = null, selected = null;
const starsText = r => r ? '★'.repeat(r) + '☆'.repeat(5 - r) : 'Henüz puan yok';

function updateTip() {
  if (!hovered) { tip.style.display = 'none'; return; }
  const t = hovered.userData.title;
  tip.innerHTML = `<b>${t}</b><br><span class="stars">${starsText(ratings[t])}</span>`;
  tip.style.display = 'block';
}
function renderPanel() {
  const r = ratings[selected] || 0;
  ptitle.textContent = selected;
  pstars.innerHTML = '';
  for (let i = 1; i <= 5; i++) {
    const s = document.createElement('span');
    s.className = 'st' + (i <= r ? ' on' : ''); s.textContent = '★';
    s.onclick = () => { ratings[selected] = i; saveRatings(); renderPanel(); updateTip(); };
    pstars.appendChild(s);
  }
}
document.getElementById('pclose').onclick = () => mode === 'focus' ? closeFocus() : closePanel();

// ---------- Fare / klavye ----------
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2(9, 9);
let dragging = false, last = {x:0, y:0, t:0}, downPos = null;
const keys = new Set();

addEventListener('pointermove', e => {
  const onCanvas = e.target === renderer.domElement;
  if (onCanvas) {
    mouse.x = (e.clientX/innerWidth)*2 - 1;
    mouse.y = -(e.clientY/innerHeight)*2 + 1;
    tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px';
  } else mouse.set(9, 9);

  if (!dragging) return;
  const dx = e.clientX - last.x, dy = e.clientY - last.y;
  const dtEvt = Math.max(.001, (e.timeStamp - last.t) / 1000);
  last = {x:e.clientX, y:e.clientY, t:e.timeStamp};
  if (mode === 'pov' && povView) {
    const k = .003 * (povView.fov / 55);
    povView.yaw = clamp(povView.yaw + dx*k, povView.baseYaw - 1.3, povView.baseYaw + 1.3);
    povView.pitch = clamp(povView.pitch + dy*k, -1.2, 1.2);
  } else if (mode === 'seat') {
    const dyaw = dx * .004 * (seatFov / 60);
    chairYaw += dyaw;
    chairVel = chairVel*.5 + clamp(dyaw / dtEvt, -6, 6)*.5;   // bırakınca ataletle dönmeye devam eder
    seatPitch = clamp(seatPitch + dy*.003*(seatFov/60), -1.0, 1.0);
  }
});
renderer.domElement.addEventListener('pointerdown', e => {
  dragging = true; downPos = {x:e.clientX, y:e.clientY};
  last = {x:e.clientX, y:e.clientY, t:e.timeStamp};
});
addEventListener('pointerup', e => {
  dragging = false;
  if (e.timeStamp - last.t > 80) chairVel = 0;                 // durarak bıraktıysa dönme
});
renderer.domElement.addEventListener('wheel', e => {
  if (mode === 'pov' && povView) povView.fov = clamp(povView.fov + Math.sign(e.deltaY)*3, 28, 65);
  if (mode === 'seat') seatFov = clamp(seatFov + Math.sign(e.deltaY)*3, 28, 70);
}, {passive:true});

renderer.domElement.addEventListener('click', e => {
  if (downPos && Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 5) return;   // sürükleme tıklama değildir
  if (transition) return;
  ray.setFromCamera(new THREE.Vector2((e.clientX/innerWidth)*2 - 1, -(e.clientY/innerHeight)*2 + 1), camera);
  const list = mode === 'seat' ? pickables.filter(o => !o.userData.chair) : pickables;
  const hit = ray.intersectObjects(list, false)[0];
  if (!hit) return;
  const u = hit.object.userData;
  if (u.title) {                                             // kitap
    if (mode === 'orbit') approachShelf(u.shelf, hit.point);
    else focusBook(hit.object);
  } else if (u.shelf && mode !== 'focus') {                  // raf
    approachShelf(u.shelf, hit.point);
  } else if (u.chair && mode !== 'seat' && mode !== 'focus') { // koltuk
    sitDown();
  }
});

addEventListener('keydown', e => {
  keys.add(e.code);
  if (e.code === 'Escape') {
    if (mode === 'focus') closeFocus();
    else if (mode !== 'orbit') goOrbit();
  }
  if (e.code === 'Tab') {
    e.preventDefault();
    if (mode === 'orbit') povView ? goTo('pov', () => povView, 1.0) : approachShelf(shelves[0], new V3(shelves[0].position.x, 1.5, SHELF_FRONT_Z));
    else if (mode === 'pov') sitDown();
    else if (mode === 'seat') goOrbit();
  }
  if (mode === 'pov' && povView && (e.code === 'ArrowUp' || e.code === 'ArrowDown')) {
    e.preventDefault();
    povView.pos.y = clamp(povView.pos.y + (e.code === 'ArrowUp' ? .38 : -.38), .6, 2.0);
    goTo('pov', () => povView, .4);
  }
});
addEventListener('keyup', e => keys.delete(e.code));

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- Ana döngü ----------
const ray2 = new THREE.Raycaster();
let lastT = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastT)/1000, .05); lastT = now;

  // Koltuk dönüşü (klavye ivmesi + atalet)
  if (mode === 'seat') {
    const left = keys.has('KeyA') || keys.has('ArrowLeft');
    const right = keys.has('KeyD') || keys.has('ArrowRight');
    if (left)  chairVel += 5*dt;
    if (right) chairVel -= 5*dt;
    chairVel = clamp(chairVel, -3, 3);
  }
  if (!(dragging && mode === 'seat')) { chairYaw += chairVel*dt; chairVel *= Math.pow(.15, dt); }
  chair.rotation.y = chairYaw;

  // Kamera
  if (transition) stepTransition(dt);
  else if (mode === 'orbit') {
    controls.update();
    camera.position.set(clamp(camera.position.x, -2.4, 2.4), clamp(camera.position.y, .3, 2.6), clamp(camera.position.z, -1.9, 2.3));
  }
  else if (mode === 'seat') applyView(seatTarget());
  else if (mode === 'pov' && povView) applyView(povView);
  else if (mode === 'focus' && focusView) applyView(focusView);

  // Hover
  ray2.setFromCamera(mouse, camera);
  const hit = ray2.intersectObjects(bookMeshes, false)[0];
  const next = hit ? hit.object : null;
  if (next !== hovered) {
    hovered = next;
    renderer.domElement.style.cursor = hovered ? 'pointer' : 'grab';
    updateTip();
  }
  bookMeshes.forEach(m => {
    const out = (m === hovered || m === focusedBook) ? .09 : 0;
    m.userData.targetZ = m.userData.baseZ + out;
    m.position.z += (m.userData.targetZ - m.position.z) * .18;
  });
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
